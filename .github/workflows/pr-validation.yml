name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  test-coverage:
    name: Testes + cobertura do código novo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout (histórico completo para diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar diff-cover
        run: pip install diff-cover

      - name: Testes + cobertura (coverlet)
        run: |
          dotnet test \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=${{ github.workspace }}/coverage/

      - name: Debug — conferir arquivos e refs
        if: always()
        run: |
          echo "--- workspace ---"
          ls -la ${{ github.workspace }}
          echo "--- coverage dir ---"
          ls -la ${{ github.workspace }}/coverage || echo "(vazio)"
          echo "--- busca cobertura em todo workspace ---"
          find ${{ github.workspace }} -name '*.cobertura.xml' -type f 2>/dev/null
          echo "--- git refs ---"
          git for-each-ref --format='%(refname)' | head -20
          echo "--- base ref reachable? ---"
          git log --oneline origin/${{ github.base_ref }} -1 2>&1 || echo "(falhou)"

      - name: Gerar relatório diff-cover
        run: |
          diff-cover ${{ github.workspace }}/coverage/coverage.cobertura.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --markdown-report=diff-cover-report.md
          echo "--- Relatório ---"
          cat diff-cover-report.md

      - name: Comentar resultado no PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: diff-coverage
          path: diff-cover-report.md

      - name: Gate de cobertura do código novo (falha se < 80%)
        run: |
          diff-cover ${{ github.workspace }}/coverage/coverage.cobertura.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80
