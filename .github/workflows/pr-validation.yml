name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  test-coverage:
    name: Testes + cobertura do código novo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout (histórico completo para diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar diff-cover
        run: pip install diff-cover

      - name: Testes + cobertura (coverlet.collector)
        run: |
          dotnet test \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ${{ github.workspace }}/coverage

      - name: Localizar arquivo de cobertura
        run: |
          COVERAGE_FILE=$(find ${{ github.workspace }}/coverage -name 'coverage.cobertura.xml' -type f | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "::error::coverage.cobertura.xml não foi gerado pelos testes"
            find ${{ github.workspace }}/coverage -type f || true
            exit 1
          fi
          echo "COVERAGE_FILE=$COVERAGE_FILE" >> $GITHUB_ENV
          echo "Arquivo de cobertura: $COVERAGE_FILE"

      - name: Gerar relatório diff-cover
        run: |
          diff-cover "$COVERAGE_FILE" \
            --compare-branch=origin/${{ github.base_ref }} \
            --markdown-report=diff-cover-report.md
          echo "--- Relatório ---"
          cat diff-cover-report.md

      - name: Comentar resultado no PR
        if: always() && hashFiles('diff-cover-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: diff-coverage
          path: diff-cover-report.md

      - name: Gate de cobertura do código novo (falha se < 80%)
        run: |
          diff-cover "$COVERAGE_FILE" \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80

      - name: Conferir se README está atualizado com a cobertura
        run: |
          # Roda o script só com o passo de atualizar o README
          # (reusa a cobertura já calculada no step anterior)
          ./scripts/update-readme-coverage.sh --skip-tests

          if ! git diff --quiet README.md; then
            echo "::error::README está desatualizado. Rode './scripts/update-readme-coverage.sh' localmente, commite o README, e faça push."
            echo ""
            echo "--- Diferença que o CI gerou ---"
            git --no-pager diff README.md
            exit 1
          fi
          echo "✅ README está atualizado"
